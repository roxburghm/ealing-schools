name: Walking distance data

# Rebuilds public/data/walk (OpenStreetMap walking isochrones from the public
# Valhalla server, no key needed) when the school data changes, and opens a pull
# request with the result. Needs "Allow GitHub Actions to create pull requests"
# enabled under Settings → Actions → General.

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild every file, even if its inputs haven't changed
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - src/plugins/schools.js
      - scripts/walking-bands.mjs

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: walking-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build walking bands
        run: node scripts/walking-bands.mjs ${{ inputs.force && '--force' || '' }}

      - name: Open a pull request if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain public/data/walk)" ]; then
            echo "Walking data already up to date."
            exit 0
          fi
          branch="walking-data/${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add public/data/walk
          git commit -m "Update walking distance data"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Update walking distance data" \
            --body "Regenerated by the walking-data workflow from OpenStreetMap walking isochrones (Valhalla) (run ${{ github.run_id }})."
